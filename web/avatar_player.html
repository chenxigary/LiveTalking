<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Human Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            color: #fff;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d12;
        }
        video {
            /* --avatar-scale shrinks the rendered person inside the stage
               without re-cutting the source. object-fit stays "contain" so
               scaling down reveals the whole frame instead of a tighter crop:
               with "cover" a narrower box just zooms further into the face,
               which is the opposite of what a smaller scale is asked for. */
            width: var(--avatar-scale, 100%);
            height: var(--avatar-scale, 100%);
            /* Hug the right edge like the reference layout: below 100% the
               freed space becomes dark canvas on the left, next to the
               conversation column, rather than a symmetric letterbox. */
            margin: auto 0 auto auto;
            object-fit: contain;
            object-position: center top;
            background: #000;
        }
        .status-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f43f5e;
            transition: all 0.3s ease;
        }
        .dot.connected {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }
        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 13, 18, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        .start-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.6);
        }
        .recovery-message {
            max-width: min(420px, 86%);
            color: #e2e8f0;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }
        input[type="checkbox"], #use-stun { display: none; }
    </style>
</head>
<body>
<input id="use-stun" type="checkbox"/>
<input type="hidden" id="sessionid" value="0">
<div id="start" style="display:none"></div>
<div id="stop" style="display:none"></div>

<div id="container">
    <div class="status-overlay">
        <div class="dot" id="statusDot"></div>
        <span id="statusLabel">未连接数字人</span>
    </div>

    <div class="start-overlay" id="startOverlay">
        <div class="recovery-message" id="recoveryMessage">正在连接数字人，语音通道仍可使用</div>
        <button class="start-btn" id="btnConnect">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            启动数字人 (Connect Avatar)
        </button>
    </div>

    <!-- strict_sync makes this WebRTC audio track the audible source so it
         shares LiveTalking's media clock with the generated video.  The
         parent can switch it back to muted direct_audio as a fallback. -->
    <audio id="audio" autoplay="true" playsinline="true" muted></audio>
    <video id="video" autoplay="true" playsinline="true" muted></video>
    <script>
        // ?avatar_scale=80 renders the person at 80% of the stage. Kept in the
        // URL rather than a build-time constant so framing can be dialled in
        // against a running session.
        (function () {
            const raw = new URLSearchParams(location.search).get('avatar_scale');
            const pct = Number(raw);
            if (Number.isFinite(pct) && pct >= 20 && pct <= 100) {
                document.documentElement.style.setProperty(
                    '--avatar-scale', pct + '%');
            }
        })();
    </script>
</div>

<script src="client.js?v=8"></script>
<script>
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const startOverlay = document.getElementById('startOverlay');
    const recoveryMessage = document.getElementById('recoveryMessage');
    const btnConnect = document.getElementById('btnConnect');
    const audio = document.getElementById('audio');
    const video = document.getElementById('video');
    let playbackMode = 'direct_audio';
    let avatarEventSource = null;
    let overlayHideTimer = null;
    const AVATAR_RECONNECT_DELAYS_MS = [500, 1000, 2000, 4000, 5000];
    let reconnectTimer = null;
    let reconnectAttempt = 0;
    let connectInFlight = false;
    let pendingReconnectReason = null;
    let connectionAttemptToken = 0;
    let sessionWatchTimer = null;
    let pageClosing = false;

    function updateStatus(connected, text) {
        statusLabel.textContent = text;
        if (connected) {
            statusDot.classList.add('connected');
        } else {
            statusDot.classList.remove('connected');
        }
    }

    function postRecoveryState(state, detail, delayMs = null) {
        recoveryMessage.textContent = detail || '';
        recoveryMessage.style.display = state === 'connected' ? 'none' : 'block';
        document.body.dataset.avatarRecoveryState = state;
        document.body.dataset.avatarRecoveryAttempt = String(reconnectAttempt);
        document.body.dataset.avatarRecoveryDetail = detail || '';
        if (!window.parent || window.parent === window) return;
        window.parent.postMessage({
            type: 'xiaoman-avatar-recovery',
            state,
            detail: detail || '',
            attempt: reconnectAttempt,
            delay_ms: delayMs,
        }, '*');
    }

    function clearReconnectTimer() {
        if (reconnectTimer !== null) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
    }

    function scheduleAvatarReconnect(reason) {
        if (pageClosing || reconnectTimer !== null) return false;
        if (connectInFlight) {
            pendingReconnectReason = reason;
            return false;
        }
        reconnectAttempt += 1;
        const delayMs = AVATAR_RECONNECT_DELAYS_MS[
            Math.min(reconnectAttempt - 1, AVATAR_RECONNECT_DELAYS_MS.length - 1)
        ];
        const delaySeconds = (delayMs / 1000).toFixed(delayMs % 1000 ? 1 : 0);
        const detail = `数字人暂不可用，语音继续；${delaySeconds} 秒后自动重连`;
        updateStatus(false, detail);
        btnConnect.disabled = false;
        btnConnect.textContent = '立即重连';
        showAudioUnlock();
        btnConnect.textContent = '立即重连';
        postRecoveryState('waiting', detail, delayMs);
        reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            initWebRTC({automatic: true, reason});
        }, delayMs);
        return true;
    }

    function clearAvatarMedia() {
        if (audio) audio.srcObject = null;
        if (video) video.srcObject = null;
    }

    function postPlaybackState(ready, error = null) {
        document.body.dataset.playbackMode = playbackMode;
        document.body.dataset.audioMuted = audio.muted ? 'true' : 'false';
        if (!window.parent || window.parent === window) return;
        window.parent.postMessage({
            type: 'xiaoman-avatar-playback',
            mode: playbackMode,
            ready: Boolean(ready),
            muted: Boolean(audio.muted),
            error,
        }, '*');
    }

    function showAudioUnlock() {
        if (overlayHideTimer !== null) {
            clearTimeout(overlayHideTimer);
            overlayHideTimer = null;
        }
        btnConnect.disabled = false;
        btnConnect.textContent = '启用同步声音';
        startOverlay.style.display = 'flex';
        startOverlay.style.opacity = '1';
    }

    function hideStartOverlay() {
        if (overlayHideTimer !== null) {
            clearTimeout(overlayHideTimer);
        }
        startOverlay.style.opacity = '0';
        overlayHideTimer = setTimeout(() => {
            startOverlay.style.display = 'none';
            overlayHideTimer = null;
        }, 300);
    }

    async function applyPlaybackMode(mode) {
        const requestedMode = mode === undefined ? playbackMode : mode;
        playbackMode = requestedMode === 'strict_sync' ? 'strict_sync' : 'direct_audio';
        audio.muted = playbackMode !== 'strict_sync';
        document.body.dataset.playbackMode = playbackMode;
        document.body.dataset.audioMuted = audio.muted ? 'true' : 'false';

        if (!audio.srcObject) {
            postPlaybackState(false);
            return false;
        }

        try {
            const playPromise = audio.play();
            // A live WebRTC audio element can keep play() pending until its
            // first non-empty frame.  The track is nevertheless attached and
            // selected now, which is enough to admit the next strict-sync
            // turn.  A later autoplay rejection is still reported below.
            postPlaybackState(playbackMode !== 'strict_sync' || !audio.muted);
            await playPromise;
            postPlaybackState(playbackMode !== 'strict_sync' || !audio.muted);
            if (playbackMode === 'strict_sync' && !audio.muted && isAvatarConnected()) {
                hideStartOverlay();
            }
            return true;
        } catch (error) {
            // An iframe can be denied audible autoplay even on localhost.
            // Keep the track muted so the parent can safely use direct audio.
            audio.muted = true;
            postPlaybackState(false, error && error.message ? error.message : String(error));
            if (playbackMode === 'strict_sync' && isAvatarConnected()) {
                showAudioUnlock();
            }
            return false;
        }
    }
    window.xiaomanApplyPlaybackMode = applyPlaybackMode;

    function stopAvatarEvents() {
        if (avatarEventSource) {
            avatarEventSource.close();
            avatarEventSource = null;
        }
    }

    function startAvatarEvents() {
        const sessionId = currentAvatarSessionId();
        stopAvatarEvents();
        if (!sessionId || typeof EventSource === 'undefined') return;

        avatarEventSource = new EventSource('/sse?sessionid=' + encodeURIComponent(sessionId));
        avatarEventSource.onmessage = (event) => {
            try {
                const payload = JSON.parse(event.data);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'xiaoman-avatar-event',
                        event: payload,
                    }, '*');
                }
            } catch (error) {
                console.warn('Invalid LiveTalking SSE event:', error);
            }
        };
        avatarEventSource.onerror = () => {
            document.body.dataset.avatarEventStream = 'error';
        };
        avatarEventSource.onopen = () => {
            document.body.dataset.avatarEventStream = 'open';
        };
    }

    // The parent Gateway owns the voice session.  LiveTalking creates its
    // session ID in the /offer response, so announce that ID before WebRTC is
    // connected and announce every subsequent connection transition.  The
    // parent can bind its Avatar Adapter without touching LiveTalking's audio
    // synthesis/playback code.
    let lastAvatarSessionAnnouncement = null;

    function currentAvatarSessionId() {
        const sidEl = document.getElementById('sessionid');
        if (!sidEl || sidEl.value === undefined || sidEl.value === null) {
            return null;
        }
        const sid = String(sidEl.value).trim();
        return sid && sid !== '0' ? sid : null;
    }

    function postAvatarSession(connected, force = false) {
        const sessionId = currentAvatarSessionId();
        if (!sessionId || !window.parent || window.parent === window) {
            return false;
        }

        const key = sessionId + ':' + (connected ? '1' : '0');
        if (!force && key === lastAvatarSessionAnnouncement) {
            return true;
        }

        window.parent.postMessage({
            type: 'xiaoman-avatar-session',
            session_id: sessionId,
            connected: Boolean(connected),
        }, '*');
        lastAvatarSessionAnnouncement = key;
        return true;
    }

    function resetAvatarSessionAnnouncement() {
        lastAvatarSessionAnnouncement = null;
        const sidEl = document.getElementById('sessionid');
        if (sidEl) sidEl.value = '0';
    }

    function watchAvatarSessionId() {
        if (sessionWatchTimer !== null) clearInterval(sessionWatchTimer);
        const timer = setInterval(() => {
            // The offer response and the connected transition can happen in
            // either order on localhost.  Never let this polling fallback
            // overwrite a newer true announcement with a hard-coded false.
            if (postAvatarSession(isAvatarConnected())) {
                clearInterval(timer);
                if (sessionWatchTimer === timer) sessionWatchTimer = null;
            }
        }, 50);
        sessionWatchTimer = timer;
        setTimeout(() => {
            clearInterval(timer);
            if (sessionWatchTimer === timer) {
                sessionWatchTimer = null;
            }
        }, 15000);
        return timer;
    }

    function handleAvatarConnectionState(event) {
        const connection = event && event.currentTarget ? event.currentTarget : pc;
        if (!connection || connection !== pc) return;
        const state = connection.connectionState;
        console.log('WebRTC state:', state);
        if (state === 'connected') {
            clearReconnectTimer();
            pendingReconnectReason = null;
            reconnectAttempt = 0;
            postAvatarSession(true);
            startAvatarEvents();
            applyPlaybackMode(playbackMode);
            updateStatus(true, '数字人已在线');
            postRecoveryState('connected', '数字人已在线');
            if (playbackMode === 'strict_sync') {
                // Keep a one-click unlock available until the browser has
                // confirmed audible WebRTC playback.
                showAudioUnlock();
            } else {
                hideStartOverlay();
            }
            video.muted = true;
            video.play().catch(() => {});
        } else if (state === 'failed' || state === 'disconnected' || state === 'closed') {
            stopAvatarEvents();
            postAvatarSession(false);
            postPlaybackState(false, 'Avatar WebRTC disconnected');
            updateStatus(false, '连接断开，重试');
            btnConnect.disabled = false;
            btnConnect.textContent = '重新连接';
            showAudioUnlock();
            btnConnect.textContent = '重新连接';
            scheduleAvatarReconnect('Avatar WebRTC ' + state);
        }
    }

    function isAvatarConnected() {
        if (pc && pc.connectionState === 'connected') return true;
        return Boolean(video.srcObject && video.readyState >= 2);
    }

    window.addEventListener('xiaoman-avatar-heartbeat', (event) => {
        const detail = event.detail || {};
        if (pageClosing || detail.ok || Number(detail.failures || 0) < 2) return;
        const reason = detail.error || 'Avatar heartbeat unavailable';
        stopAvatarEvents();
        postAvatarSession(false);
        postPlaybackState(false, reason);
        scheduleAvatarReconnect(reason);
    });

    // Replay state when the parent is ready.  This closes a localhost race in
    // which the offer can complete before the parent message listener exists.
    window.addEventListener('message', (event) => {
        if (!event.data) return;
        if (event.data.type === 'xiaoman-avatar-status-request') {
            postAvatarSession(isAvatarConnected(), true);
            postPlaybackState(Boolean(audio.srcObject) &&
                (playbackMode !== 'strict_sync' || !audio.muted));
        } else if (event.data.type === 'xiaoman-playback-mode') {
            applyPlaybackMode(event.data.mode);
        }
    });

    async function initWebRTC({automatic = false, reason = ''} = {}) {
        if (pageClosing || connectInFlight) return false;
        clearReconnectTimer();
        connectInFlight = true;
        pendingReconnectReason = null;
        const attemptToken = ++connectionAttemptToken;
        btnConnect.disabled = true;
        btnConnect.textContent = "连接中...";
        const connectingText = automatic
            ? `正在自动重连数字人（第 ${reconnectAttempt} 次）...`
            : "正在握手 WebRTC...";
        updateStatus(false, connectingText);
        postRecoveryState(automatic ? 'retrying' : 'connecting', connectingText);

        try {
            if (pc) {
                postAvatarSession(false, true);
                stop();
            }
            clearAvatarMedia();
            resetAvatarSessionAnnouncement();
            const startPromise = start();
            if (pc) {
                pc.addEventListener('connectionstatechange', handleAvatarConnectionState);
            }
            watchAvatarSessionId();
            await startPromise;
            if (attemptToken !== connectionAttemptToken || pageClosing) return false;
            // client.js writes the ID immediately after the offer response.
            // setRemoteDescription can also transition to "connected" before
            // this await resumes, so replay the authoritative state instead
            // of overwriting a just-sent true announcement with false.
            postAvatarSession(isAvatarConnected(), true);
            startAvatarEvents();
            await applyPlaybackMode(playbackMode);

            // Fallback timeout check
            setTimeout(() => {
                if (attemptToken !== connectionAttemptToken || pageClosing) return;
                if (!pc || pc.connectionState !== 'connected') {
                    if (video.srcObject && video.readyState >= 2) {
                        postAvatarSession(true);
                        updateStatus(true, '数字人已在线');
                        clearReconnectTimer();
                        pendingReconnectReason = null;
                        reconnectAttempt = 0;
                        postRecoveryState('connected', '数字人已在线');
                        hideStartOverlay();
                        video.muted = true;
                        video.play().catch(() => {});
                        startAvatarEvents();
                        applyPlaybackMode(playbackMode);
                    } else {
                        scheduleAvatarReconnect('Avatar WebRTC connection timeout');
                    }
                }
            }, 3000);
            return true;

        } catch (e) {
            console.error("WebRTC start error:", e);
            postAvatarSession(false);
            const errorText = "连接异常: " + e.message;
            updateStatus(false, errorText);
            btnConnect.disabled = false;
            btnConnect.textContent = "重试";
            postRecoveryState('failed', errorText);
            pendingReconnectReason = reason || errorText;
            return false;
        } finally {
            connectInFlight = false;
            if (pendingReconnectReason && !pageClosing) {
                const retryReason = pendingReconnectReason;
                pendingReconnectReason = null;
                scheduleAvatarReconnect(retryReason);
            }
        }
    }

    btnConnect.addEventListener('click', () => {
        if (isAvatarConnected()) {
            applyPlaybackMode(playbackMode);
        } else {
            clearReconnectTimer();
            reconnectAttempt = 0;
            initWebRTC({automatic: false, reason: 'manual reconnect'});
        }
    });

    // Auto connect on page load
    window.addEventListener('DOMContentLoaded', () => {
        initWebRTC();
    });

    document.getElementById('container').addEventListener('click', () => {
        if (video) {
            video.muted = true;
            video.play().catch(() => {});
        }
        applyPlaybackMode(playbackMode);
    });

    function shutdownAvatarPage() {
        if (pageClosing) return;
        pageClosing = true;
        connectionAttemptToken += 1;
        clearReconnectTimer();
        if (sessionWatchTimer !== null) {
            clearInterval(sessionWatchTimer);
            sessionWatchTimer = null;
        }
        stopAvatarEvents();
        postAvatarSession(false, true);
        stop();
        clearAvatarMedia();
    }

    // Capture phase runs before client.js' own bubble listener, preserving the
    // last session ID long enough to announce the disconnect to the parent.
    window.addEventListener('pagehide', shutdownAvatarPage, {capture: true});
    window.addEventListener('beforeunload', shutdownAvatarPage, {capture: true});
</script>
</body>
</html>
