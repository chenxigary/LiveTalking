<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Human Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            color: #fff;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d12;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            background: #000;
        }
        .status-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f43f5e;
            transition: all 0.3s ease;
        }
        .dot.connected {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }
        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 13, 18, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        .start-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.6);
        }
        input[type="checkbox"], #use-stun { display: none; }
    </style>
</head>
<body>
<input id="use-stun" type="checkbox"/>
<input type="hidden" id="sessionid" value="0">
<div id="start" style="display:none"></div>
<div id="stop" style="display:none"></div>

<div id="container">
    <div class="status-overlay">
        <div class="dot" id="statusDot"></div>
        <span id="statusLabel">未连接数字人</span>
    </div>

    <div class="start-overlay" id="startOverlay">
        <button class="start-btn" id="btnConnect">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            启动数字人 (Connect Avatar)
        </button>
    </div>

    <!-- strict_sync makes this WebRTC audio track the audible source so it
         shares LiveTalking's media clock with the generated video.  The
         parent can switch it back to muted direct_audio as a fallback. -->
    <audio id="audio" autoplay="true" playsinline="true" muted></audio>
    <video id="video" autoplay="true" playsinline="true" muted></video>
</div>

<script src="client.js?v=7"></script>
<script>
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const startOverlay = document.getElementById('startOverlay');
    const btnConnect = document.getElementById('btnConnect');
    const audio = document.getElementById('audio');
    const video = document.getElementById('video');
    let playbackMode = 'direct_audio';
    let avatarEventSource = null;
    let overlayHideTimer = null;

    function updateStatus(connected, text) {
        statusLabel.textContent = text;
        if (connected) {
            statusDot.classList.add('connected');
        } else {
            statusDot.classList.remove('connected');
        }
    }

    function postPlaybackState(ready, error = null) {
        document.body.dataset.playbackMode = playbackMode;
        document.body.dataset.audioMuted = audio.muted ? 'true' : 'false';
        if (!window.parent || window.parent === window) return;
        window.parent.postMessage({
            type: 'xiaoman-avatar-playback',
            mode: playbackMode,
            ready: Boolean(ready),
            muted: Boolean(audio.muted),
            error,
        }, '*');
    }

    function showAudioUnlock() {
        if (overlayHideTimer !== null) {
            clearTimeout(overlayHideTimer);
            overlayHideTimer = null;
        }
        btnConnect.disabled = false;
        btnConnect.textContent = '启用同步声音';
        startOverlay.style.display = 'flex';
        startOverlay.style.opacity = '1';
    }

    function hideStartOverlay() {
        if (overlayHideTimer !== null) {
            clearTimeout(overlayHideTimer);
        }
        startOverlay.style.opacity = '0';
        overlayHideTimer = setTimeout(() => {
            startOverlay.style.display = 'none';
            overlayHideTimer = null;
        }, 300);
    }

    async function applyPlaybackMode(mode) {
        const requestedMode = mode === undefined ? playbackMode : mode;
        playbackMode = requestedMode === 'strict_sync' ? 'strict_sync' : 'direct_audio';
        audio.muted = playbackMode !== 'strict_sync';
        document.body.dataset.playbackMode = playbackMode;
        document.body.dataset.audioMuted = audio.muted ? 'true' : 'false';

        if (!audio.srcObject) {
            postPlaybackState(false);
            return false;
        }

        try {
            const playPromise = audio.play();
            // A live WebRTC audio element can keep play() pending until its
            // first non-empty frame.  The track is nevertheless attached and
            // selected now, which is enough to admit the next strict-sync
            // turn.  A later autoplay rejection is still reported below.
            postPlaybackState(playbackMode !== 'strict_sync' || !audio.muted);
            await playPromise;
            postPlaybackState(playbackMode !== 'strict_sync' || !audio.muted);
            if (playbackMode === 'strict_sync' && !audio.muted && isAvatarConnected()) {
                hideStartOverlay();
            }
            return true;
        } catch (error) {
            // An iframe can be denied audible autoplay even on localhost.
            // Keep the track muted so the parent can safely use direct audio.
            audio.muted = true;
            postPlaybackState(false, error && error.message ? error.message : String(error));
            if (playbackMode === 'strict_sync' && isAvatarConnected()) {
                showAudioUnlock();
            }
            return false;
        }
    }
    window.xiaomanApplyPlaybackMode = applyPlaybackMode;

    function stopAvatarEvents() {
        if (avatarEventSource) {
            avatarEventSource.close();
            avatarEventSource = null;
        }
    }

    function startAvatarEvents() {
        const sessionId = currentAvatarSessionId();
        stopAvatarEvents();
        if (!sessionId || typeof EventSource === 'undefined') return;

        avatarEventSource = new EventSource('/sse?sessionid=' + encodeURIComponent(sessionId));
        avatarEventSource.onmessage = (event) => {
            try {
                const payload = JSON.parse(event.data);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'xiaoman-avatar-event',
                        event: payload,
                    }, '*');
                }
            } catch (error) {
                console.warn('Invalid LiveTalking SSE event:', error);
            }
        };
        avatarEventSource.onerror = () => {
            document.body.dataset.avatarEventStream = 'error';
        };
        avatarEventSource.onopen = () => {
            document.body.dataset.avatarEventStream = 'open';
        };
    }

    // The parent Gateway owns the voice session.  LiveTalking creates its
    // session ID in the /offer response, so announce that ID before WebRTC is
    // connected and announce every subsequent connection transition.  The
    // parent can bind its Avatar Adapter without touching LiveTalking's audio
    // synthesis/playback code.
    let lastAvatarSessionAnnouncement = null;

    function currentAvatarSessionId() {
        const sidEl = document.getElementById('sessionid');
        if (!sidEl || sidEl.value === undefined || sidEl.value === null) {
            return null;
        }
        const sid = String(sidEl.value).trim();
        return sid && sid !== '0' ? sid : null;
    }

    function postAvatarSession(connected, force = false) {
        const sessionId = currentAvatarSessionId();
        if (!sessionId || !window.parent || window.parent === window) {
            return false;
        }

        const key = sessionId + ':' + (connected ? '1' : '0');
        if (!force && key === lastAvatarSessionAnnouncement) {
            return true;
        }

        window.parent.postMessage({
            type: 'xiaoman-avatar-session',
            session_id: sessionId,
            connected: Boolean(connected),
        }, '*');
        lastAvatarSessionAnnouncement = key;
        return true;
    }

    function resetAvatarSessionAnnouncement() {
        lastAvatarSessionAnnouncement = null;
        const sidEl = document.getElementById('sessionid');
        if (sidEl) sidEl.value = '0';
    }

    function watchAvatarSessionId() {
        const timer = setInterval(() => {
            // The offer response and the connected transition can happen in
            // either order on localhost.  Never let this polling fallback
            // overwrite a newer true announcement with a hard-coded false.
            if (postAvatarSession(isAvatarConnected())) {
                clearInterval(timer);
            }
        }, 50);
        setTimeout(() => clearInterval(timer), 15000);
        return timer;
    }

    function handleAvatarConnectionState() {
        if (!pc) return;
        const state = pc.connectionState;
        console.log('WebRTC state:', state);
        if (state === 'connected') {
            postAvatarSession(true);
            startAvatarEvents();
            applyPlaybackMode(playbackMode);
            updateStatus(true, '数字人已在线');
            if (playbackMode === 'strict_sync') {
                // Keep a one-click unlock available until the browser has
                // confirmed audible WebRTC playback.
                showAudioUnlock();
            } else {
                hideStartOverlay();
            }
            video.muted = true;
            video.play().catch(() => {});
        } else if (state === 'failed' || state === 'disconnected' || state === 'closed') {
            stopAvatarEvents();
            postAvatarSession(false);
            postPlaybackState(false, 'Avatar WebRTC disconnected');
            updateStatus(false, '连接断开，重试');
            btnConnect.disabled = false;
            btnConnect.textContent = '重新连接';
            showAudioUnlock();
            btnConnect.textContent = '重新连接';
        }
    }

    function isAvatarConnected() {
        if (pc && pc.connectionState === 'connected') return true;
        return Boolean(video.srcObject && video.readyState >= 2);
    }

    // Replay state when the parent is ready.  This closes a localhost race in
    // which the offer can complete before the parent message listener exists.
    window.addEventListener('message', (event) => {
        if (!event.data) return;
        if (event.data.type === 'xiaoman-avatar-status-request') {
            postAvatarSession(isAvatarConnected(), true);
            postPlaybackState(Boolean(audio.srcObject) &&
                (playbackMode !== 'strict_sync' || !audio.muted));
        } else if (event.data.type === 'xiaoman-playback-mode') {
            applyPlaybackMode(event.data.mode);
        }
    });

    async function initWebRTC() {
        btnConnect.disabled = true;
        btnConnect.textContent = "连接中...";
        updateStatus(false, "正在握手 WebRTC...");

        try {
            resetAvatarSessionAnnouncement();
            const startPromise = start();
            if (pc) {
                pc.addEventListener('connectionstatechange', handleAvatarConnectionState);
            }
            watchAvatarSessionId();
            await startPromise;
            // client.js writes the ID immediately after the offer response.
            // setRemoteDescription can also transition to "connected" before
            // this await resumes, so replay the authoritative state instead
            // of overwriting a just-sent true announcement with false.
            postAvatarSession(isAvatarConnected(), true);
            startAvatarEvents();
            await applyPlaybackMode(playbackMode);

            // Fallback timeout check
            setTimeout(() => {
                if (!pc || pc.connectionState !== 'connected') {
                    if (video.srcObject && video.readyState >= 2) {
                        postAvatarSession(true);
                        updateStatus(true, '数字人已在线');
                        hideStartOverlay();
                        video.muted = true;
                        video.play().catch(() => {});
                        startAvatarEvents();
                        applyPlaybackMode(playbackMode);
                    }
                }
            }, 3000);

        } catch (e) {
            console.error("WebRTC start error:", e);
            postAvatarSession(false);
            updateStatus(false, "连接异常: " + e.message);
            btnConnect.disabled = false;
            btnConnect.textContent = "重试";
        }
    }

    btnConnect.addEventListener('click', () => {
        if (isAvatarConnected()) {
            applyPlaybackMode(playbackMode);
        } else {
            initWebRTC();
        }
    });

    // Auto connect on page load
    window.addEventListener('DOMContentLoaded', () => {
        initWebRTC();
    });

    document.getElementById('container').addEventListener('click', () => {
        if (video) {
            video.muted = true;
            video.play().catch(() => {});
        }
        applyPlaybackMode(playbackMode);
    });

    // pagehide fires for tab close/navigation and is more reliable than
    // relying on the LiveTalking client's delayed pc.close() callbacks.
    window.addEventListener('pagehide', () => {
        stopAvatarEvents();
        postAvatarSession(false, true);
    });
    window.addEventListener('beforeunload', () => {
        stopAvatarEvents();
        postAvatarSession(false, true);
    });
</script>
</body>
</html>
